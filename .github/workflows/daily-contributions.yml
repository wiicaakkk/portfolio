name: Daily Contribution Automation

on:
  schedule:
    # Runs every day at 00:00 UTC (07:00 WIB) and 12:00 UTC (19:00 WIB)
    - cron: '0 0 * * *'
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update Daily Activity Log
        run: |
          mkdir -p activity_logs
          CURRENT_DATE=$(date -u +'%Y-%m-%d %H:%M:%S UTC')
          echo "{\"last_updated\": \"${CURRENT_DATE}\", \"status\": \"Active\"}" > activity_logs/daily_activity.json
          
          # Maintain a formatted markdown log
          if [ ! -f activity_logs/ACTIVITY.md ]; then
            echo "# Daily Activity Logs" > activity_logs/ACTIVITY.md
            echo "| Date & Time (UTC) | Status | Trigger |" >> activity_logs/ACTIVITY.md
            echo "|---|---|---|" >> activity_logs/ACTIVITY.md
          fi
          echo "| ${CURRENT_DATE} | System Active 🟢 | GitHub Actions |" >> activity_logs/ACTIVITY.md

      - name: Commit and Push Changes
        run: |
          git config --local user.email "bagus.wicakono285@gmail.com"
          git config --local user.name "wiicaakkk"
          
          git add activity_logs/daily_activity.json activity_logs/ACTIVITY.md
          
          # Only commit if there are changes
          if ! git diff --staged --quiet; then
            git commit -m "chore(auto): daily contribution sync [$(date -u +'%Y-%m-%d')]"
            git push origin master
          else
            echo "No changes to commit."
          fi
